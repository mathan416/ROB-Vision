name: Build Batocera emulator wrappers

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - deploy/retropie/rob_vision_fceumm_proxy.c
      - deploy/batocera/build-cores.sh
      - .github/workflows/build-batocera-cores.yml

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build x86_64 wrappers
        run: |
          sh deploy/batocera/build-cores.sh
          file deploy/batocera/cores/x86_64/*
      - uses: actions/upload-artifact@v4
        with:
          name: batocera-cores-x86_64
          path: deploy/batocera/cores/x86_64/*.so
          if-no-files-found: error
