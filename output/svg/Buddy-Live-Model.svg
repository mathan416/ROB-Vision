<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="650" height="590" id="robot-svg" class="robot-svg" viewBox="0 0 650 590" role="img" aria-label="R.O.B.-inspired robot with two opposing hands moving matching Gyromite gyros or Stack-Up blocks between accessory stations">
  <title>Buddy — R.O.B. Vision Live Model</title>
  <desc>Static Gyromite home pose exported from the current Live Model design. Original part IDs and groups are preserved for editing. Animation is supplied separately by dashboard/app.js.</desc>
  <style>
